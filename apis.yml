apis:
- aid: sage:intacct
  name: Sage Intacct API
  description: >-
    Sage Intacct provides both REST and XML APIs for advanced financial management including multi-entity
    consolidations, project accounting, revenue recognition, and advanced reporting. The REST API uses
    OAuth 2.0 for authorization. Targeted at mid-market and enterprise finance teams.
  humanURL: https://developer.sage.com/intacct/
  tags:
  - Accounting
  - ERP
  - REST
  - XML
  - Authentication
  tags_raw:
  - Accounting
  - ERP
  - REST
  - XML
  - OAuth 2.0
  properties:
  - type: Documentation
    url: https://developer.intacct.com/api/
  - type: Authentication
    url: >-
      https://developer.sage.com/intacct/docs/1/sage-intacct-rest-api/authorization-and-security/oauth2
- aid: sage:sage-x3
  name: Sage X3 API
  description: >-
    Sage X3 provides a GraphQL API offering flexible data access for ERP operations including manufacturing,
    distribution, procurement, finance, and CRM. Supports SOAP API for legacy integrations. Targeted at
    enterprise and manufacturing organizations.
  humanURL: https://developer.sage.com/x3/
  tags:
  - ERP
  - GraphQL
  - Manufacturing
  - Distribution
  properties:
  - type: Documentation
    url: https://developer.sage.com/x3/
  - url: graphql/sage-graphql.md
    type: GraphQL
- aid: sage:sage-200
  name: Sage 200 API
  description: >-
    Sage 200 API provides REST access to Sage 200 Standard and Professional business management data including
    customers, suppliers, stock, sales orders, purchase orders, nominal ledger, bank reconciliation, and
    financial reporting for UK and Ireland mid-size businesses.
  humanURL: https://developer.sage.com/sage-200/
  tags:
  - Accounting
  - ERP
  - REST
  properties:
  - type: Documentation
    url: https://developer.sage.com/sage-200/
